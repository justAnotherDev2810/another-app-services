ANOTHER_SERVICE_ENDPOINT: http://localhost:8091

server:
  port: ${SERVER_PORT:8092} # another-service is on 8091, ingestor on 8092

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:ingestor-service}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # In docker-compose: KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Locally: falls back to localhost:9092
    consumer:
      group-id: ingestor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Base URL for calling another-service
# Change this per environment — local dev points to localhost
clients:
  another-service:
    name: another-service
    url: ${ANOTHER_SERVICE_ENDPOINT:http://localhost:8091}
