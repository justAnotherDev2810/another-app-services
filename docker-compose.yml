version: '3.8'

services:

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5433:5432" 
    environment:
      POSTGRES_DB: justanotherapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2810
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d justanotherapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin ──────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@justanotherapp.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy

  # ── Flyway Migrations ─────────────────────────────────────────
  flyway-migrations:
    build:
      context: ./database-migrations
      dockerfile: Dockerfile
    container_name: flyway-migrations
    environment:
      ENV: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: justanotherapp
      DB_USERNAME: postgres
      DB_PASSWORD: 2810
      ANOTHER_SERVICE_SCHEMA: app_schema_users_service
    depends_on:
      postgres:
        condition: service_healthy

  # ── Kafka ─────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Kafka UI ──────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ── another-service ───────────────────────────────────────────
  another-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        SERVICE_PATH: another-service
        JAR_NAME: another-service-0.0.1-SNAPSHOT
    container_name: another-service
    restart: always
    ports:
      - "8091:8091"
    environment:
      SPRING_APPLICATION_NAME: another-service
      SERVER_PORT: 8091
      POSTGRES_URL: jdbc:postgresql://postgres:5432/justanotherapp
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: 2810
      POSTGRES_SCHEMA: app_schema_users_service
    depends_on:
      postgres:
        condition: service_healthy
      flyway-migrations:
        condition: service_completed_successfully
    command: ["java", "-jar", "app.jar"]

  # ── ingestor-service ──────────────────────────────────────────
  ingestor-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        SERVICE_PATH: ingestor-service
        JAR_NAME: ingestor-service-0.0.1-SNAPSHOT
    container_name: ingestor-service
    restart: always
    ports:
      - "8092:8092"
    environment:
      SPRING_APPLICATION_NAME: ingestor-service
      SERVER_PORT: 8092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ANOTHER_SERVICE_ENDPOINT: http://another-service:8091
    depends_on:
      kafka:
        condition: service_healthy
      another-service:
        condition: service_started
    command: ["java", "-jar", "app.jar"]

    # ──  Dozzle ───────────────────────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data: