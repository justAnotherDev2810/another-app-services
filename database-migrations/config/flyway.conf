# Base Flyway configuration for all services
# Values here are overridden by environment-specific settings and command-line parameters
# Format: flyway.key=value

flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
flyway.user=${DB_USERNAME}
flyway.password=${DB_PASSWORD}

# Placeholders
flyway.placeholderReplacement=true

# Locations - intentionally left empty; overridden per-service via CLI -locations
# this prevents the flyway docker image default (filesystem:/flyway/sql) from
# scanning ALL service subdirectories and causing duplicate version errors
flyway.locations=

# Schema (set per-service deployment)
flyway.schemas=${SERVICE_SCHEMA}

# Create schema if it doesn't exist
flyway.createSchemas=true
flyway.table=flyway_schema_history

# Baseline existing DB on first run
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.baselineDescription=Initial baseline
flyway.outOfOrder=true
flyway.validateOnMigrate=true

# Encoding
flyway.encoding=UTF-8
flyway.sqlMigrationSuffix=.sql